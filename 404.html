<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070d">
    <meta name="robots" content="noindex">
    <title>404 — MUFFIN.</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 75% 20%,
                    rgba(85, 115, 210, 0.13),
                    transparent 40%
                ),
                radial-gradient(
                    ellipse at 15% 85%,
                    rgba(85, 105, 180, 0.06),
                    transparent 40%
                ),
                #05070d;

            color: #f0f1f5;
            font-family: "DM Sans", sans-serif;
        }

        .error {
            width: min(650px, 90%);
            text-align: center;
            animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .logo {
            margin-bottom: 65px;
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .logo span,
        h1 span {
            color: #a8baff;
        }

        .number {
            color: rgba(168, 186, 255, 0.12);
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(110px, 25vw, 210px);
            font-weight: 700;
            letter-spacing: -15px;
            line-height: 0.9;
            user-select: none;
        }

        h1 {
            margin-top: 25px;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(27px, 5vw, 42px);
            font-weight: 600;
            letter-spacing: -1.5px;
        }

        p {
            margin-top: 15px;
            color: #858a98;
            font-size: 14px;
            line-height: 1.8;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            margin-top: 35px;
            padding: 14px 23px;

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50px;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);

            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;

            transition:
                transform 0.4s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        a:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 186, 255, 0.5);
            background: rgba(168, 186, 255, 0.1);
        }

        a span {
            color: #a8baff;
            transition: transform 0.3s ease;
        }

        a:hover span {
            transform: translate(3px, -3px);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @media (max-width: 480px) {
            .logo {
                margin-bottom: 50px;
            }

            .number {
                letter-spacing: -8px;
            }

            p {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error {
                animation: none;
            }

            a,
            a span {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="error">

        <div class="logo">
            MUFFIN<span>.</span>
        </div>

        <div class="number">
            404
        </div>

        <h1>
            Lost in <span>space.</span>
        </h1>

        <p>
            The page you're looking for doesn't exist
            or has been moved.
        </p>

        <a href="./">
            Back to homepage <span>↗</span>
        </a>

    </main>

</body>
</html>
